<title>Lines — Make them Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'"><!-- fonts-async -->
<style>
:root{
  --v1:#4f56e8;--v2:#7a5cff;--pk:#ff7eb6;--bl:#6aa8ff;--pe:#ffb27a;--mint:#5fd3b5;
  --grad:linear-gradient(135deg,#3f48d8 0%,#5a5cf0 55%,#8a6bff 100%);
  --grad-soft:linear-gradient(135deg,#efe9ff,#fde9f5 55%,#e6efff);
  --ink:#1f1d3a;--ink2:#4a4766;--muted:#8f8aa3;--line:rgba(120,100,190,.12);
  --glass:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.72));
  --gshadow:0 1px 0 rgba(255,255,255,.9) inset,0 16px 36px -16px rgba(90,70,160,.26),0 2px 6px rgba(90,70,160,.05);
  --r:26px;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Plus Jakarta Sans","Readex Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:#f7f2ec}
[dir=rtl],.ar{font-family:"Readex Pro","Plus Jakarta Sans",system-ui,sans-serif}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;touch-action:manipulation}
button,.nav,.tile,.chip,.btn,.lrow,.book,.feat,.story,.check,.cal .d{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
::-webkit-scrollbar{width:0;height:0}
button{cursor:pointer;border:0;background:none;padding:0}
/* pastel mesh background like the reference */
.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 40% at 0% 30%,#efe6fb 0%,transparent 70%),
  radial-gradient(55% 40% at 100% 60%,#fbe7ef 0%,transparent 70%),
  radial-gradient(60% 45% at 50% 100%,#e9ecfb 0%,transparent 70%),#f7f2ec}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 22s ease-in-out infinite}
.bg i:nth-child(1){width:260px;height:260px;background:#cdb8ff;top:8%;left:-60px}
.bg i:nth-child(2){width:240px;height:240px;background:#ffc6e2;top:42%;right:-80px;animation-delay:-7s}
.bg i:nth-child(3){width:280px;height:280px;background:#bcd5ff;bottom:-60px;left:20%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-26px) scale(1.12)}}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 130px)}
/* glass */
.g{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--gshadow);padding:16px;margin-bottom:14px;position:relative}
.press{transition:transform .5s var(--spring)}
.press:active{transform:scale(.965)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.dots4{display:grid;grid-template-columns:repeat(2,7px);gap:4px}
.dots4 i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.brandrow{display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.4px}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;gap:10px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--gshadow);transition:transform .5s var(--spring);color:var(--ink)}
.iconbtn:active{transform:scale(.86)}
.iconbtn svg{width:20px;height:20px}
.avatar{width:44px;height:44px;border-radius:50%;padding:2.5px;background:conic-gradient(from 0deg,#6d5dfc,#e98bd8,#ffb27a,#6aa8ff,#6d5dfc);animation:spin 8s linear infinite}
.avatar b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;font-size:16px;font-weight:800;color:var(--v1);animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* view transitions */
.enter{animation:enter .7s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.st>*{animation:rise .75s var(--ease) both}
.st>*:nth-child(1){animation-delay:.02s}.st>*:nth-child(2){animation-delay:.07s}.st>*:nth-child(3){animation-delay:.12s}.st>*:nth-child(4){animation-delay:.17s}.st>*:nth-child(5){animation-delay:.22s}.st>*:nth-child(6){animation-delay:.27s}.st>*:nth-child(7){animation-delay:.32s}.st>*:nth-child(8){animation-delay:.37s}.st>*:nth-child(n+9){animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.rise{animation:rise .7s var(--ease) both}
/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
h1{font-size:34px;letter-spacing:-1.2px;margin:6px 0 4px;font-weight:800;line-height:1.08}
.sub{color:var(--ink2);font-size:15px;margin:0 0 16px}
h2{font-size:18px;margin:22px 4px 10px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between}
h2 small,.link{font-size:13px;font-weight:600;color:var(--muted)}
h3{font-size:16px;margin:0 0 8px;font-weight:800;letter-spacing:-.2px}
.muted{color:var(--muted);font-size:13px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* search */
.search{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:20px;margin-bottom:18px}
.search input{border:0;background:transparent;outline:none;flex:1;padding:0;box-shadow:none!important}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2)}
.tile .ic{width:62px;height:62px;border-radius:21px;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 12px 22px -8px var(--sh),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .5s var(--spring)}
.tile .ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 55%)}
.tile:active .ic{transform:scale(.86) rotate(-4deg)}
.tile svg{width:26px;height:26px;position:relative;z-index:1}
/* featured carousel */
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 14px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.feat{flex:none;width:86%;height:200px;border-radius:28px;overflow:hidden;position:relative;scroll-snap-align:center;color:#fff;box-shadow:0 22px 40px -16px rgba(60,40,140,.5);transition:transform .5s var(--spring)}
.feat:active{transform:scale(.97)}
.feat .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .fx{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,14,50,.55));}
.feat .ft{position:absolute;left:20px;right:70px;bottom:18px}
.feat .ft small{display:block;font-size:12px;font-weight:700;letter-spacing:1px;opacity:.9;text-transform:uppercase}
.feat .ft b{display:block;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.4px;margin-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.feat .go{position:absolute;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.feat .go svg{width:20px;height:20px}
.feat .chipx{position:absolute;left:16px;top:14px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);font-size:11.5px;font-weight:700}
.cdots{display:flex;gap:6px;justify-content:center;margin:-4px 0 6px}
.cdots i{width:6px;height:6px;border-radius:9px;background:rgba(124,92,255,.25);transition:all .4s var(--spring)}
.cdots i.on{width:20px;background:var(--v1)}
/* scene animations */
img.scene{animation:kb 40s ease-in-out infinite alternate;transform-origin:62% 40%}
@keyframes kb{to{transform:scale(1.1)}}
.homehero.dark .pills span{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.25)}
.food{cursor:pointer}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.drift{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(38px)}}
.glow{animation:glow 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{50%{transform:scale(1.12);opacity:.85}}
.shimmer{animation:shim 4s ease-in-out infinite}
@keyframes shim{50%{transform:translateX(10px);opacity:.35}}
.bird{animation:bird 14s linear infinite}
@keyframes bird{from{transform:translate(-60px,10px)}to{transform:translate(460px,-30px)}}
.shoot{animation:shoot 7s ease-in infinite;opacity:0}
@keyframes shoot{0%,80%{opacity:0;transform:translate(0,0)}84%{opacity:1}100%{opacity:0;transform:translate(-160px,80px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:18px;font-weight:700;font-size:15px;transition:transform .5s var(--spring),box-shadow .3s;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 12px 24px -8px rgba(109,93,252,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.white{background:#fff;color:var(--v1);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.btn.soft{background:rgba(124,92,255,.11);color:var(--v1)}
.btn.ghost{background:rgba(120,100,190,.1)}
.btn.danger{background:#ffe8f1;color:#e0457b}
.btn.block{width:100%}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:#fff}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
.btn.soft .ripple,.btn.ghost .ripple,.chip .ripple{background:rgba(124,92,255,.2)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;padding:9px 15px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--gshadow);font-size:13px;font-weight:600;transition:all .45s var(--spring);position:relative;overflow:hidden}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.seg{display:flex;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:4px;margin-bottom:16px;position:relative}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(108,82,200,.18);transition:left .55s var(--spring),width .55s var(--spring)}
.seg button{flex:1;padding:10px 4px;font-size:14px;font-weight:700;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--v1)}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none}
.nav-in{pointer-events:auto;max-width:470px;margin:0 auto;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:30px;box-shadow:0 16px 40px -10px rgba(80,60,170,.35),inset 0 1px 0 #fff;display:flex;align-items:center;padding:8px 6px;border:1px solid rgba(255,255,255,.85);position:relative}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0;transition:color .3s}
.nav .tab svg{width:23px;height:23px;transition:transform .55s var(--spring)}
.nav .tab.on{color:var(--v1)}
.nav .tab.on svg{transform:translateY(-3px) scale(1.12)}
.nav .tab .dot{width:4px;height:4px;border-radius:50%;background:var(--v1);opacity:0;transform:scale(0);transition:all .45s var(--spring)}
.nav .tab.on .dot{opacity:1;transform:none}
.nav .plus{flex:none;width:58px;height:58px;margin:-30px 4px 0;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -6px rgba(109,93,252,.7),inset 0 2px 0 rgba(255,255,255,.4),0 0 0 6px rgba(255,255,255,.65);transition:transform .55s var(--spring)}
.nav .plus:active{transform:rotate(90deg) scale(.88)}
.nav .plus svg{width:27px;height:27px}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--c,#cfc8e6);background:rgba(255,255,255,.6);display:grid;place-items:center;transition:all .45s var(--spring);position:relative}
.check.done{background:var(--c,var(--v1));border-color:var(--c,var(--v1));box-shadow:0 6px 14px -4px var(--c,var(--v1))}
.check.done::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);animation:tick .35s var(--spring)}
@keyframes tick{from{transform:rotate(45deg) scale(0)}}
.burst{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:burst .7s var(--ease) forwards;z-index:40}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.task .t{flex:1;min-width:0;cursor:pointer}
.task .t .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;position:relative;display:inline-block;max-width:100%}
.task .t .tt::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--muted);transition:width .5s var(--ease)}
.task.done .t .tt{color:var(--muted)}
.task.done .t .tt::after{width:100%}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(124,92,255,.11);color:var(--v1);margin-right:4px}
.quickadd{display:flex;gap:8px;margin-top:10px}
.quickadd input{flex:1}
.plusbtn{width:48px;flex:none;padding:0}
.addround{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600;box-shadow:0 8px 16px -6px rgba(109,93,252,.7);transition:transform .5s var(--spring)}
.addround:active{transform:scale(.85) rotate(90deg)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{width:100%;border:1.5px solid rgba(124,92,255,.14);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.75);outline:none;transition:border .3s,box-shadow .3s}
input:focus,textarea:focus,select:focus{border-color:rgba(124,92,255,.5);box-shadow:0 0 0 4px rgba(124,92,255,.12)}
textarea{resize:vertical;min-height:90px;line-height:1.7}
label.l{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 2px 7px}
/* streak card */
.streak{display:flex;gap:14px;align-items:center}
.trophy{width:58px;height:58px;border-radius:19px;flex:none;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#ffd36e,#ff9f5a);box-shadow:0 12px 22px -8px rgba(255,150,70,.7),inset 0 1px 0 rgba(255,255,255,.6)}
.week{display:flex;justify-content:space-between;margin-top:14px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.week b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(124,92,255,.08);font-size:14px;transition:all .5s var(--spring)}
.week b.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px -4px rgba(109,93,252,.7)}
.week b.today{outline:2px dashed rgba(124,92,255,.5);outline-offset:2px}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 8px;margin:0 -18px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:76px;text-align:center;font-size:11px;font-weight:600;cursor:pointer}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;margin:0 auto 6px;position:relative;transition:transform .5s var(--spring)}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#6d5dfc,#e98bd8,#ffb27a,#6aa8ff,#6d5dfc);animation:spin 6s linear infinite}
.story:active .ring{transform:scale(.9)}
.ring .in{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid #fff;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.story span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* books */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.book{cursor:pointer}
.cover{aspect-ratio:2/3;border-radius:6px 16px 16px 6px;position:relative;overflow:hidden;color:#fff;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 26px -12px rgba(70,50,160,.55),inset 7px 0 0 rgba(0,0,0,.12),inset 9px 0 0 rgba(255,255,255,.14);transition:transform .6s var(--spring);transform-origin:left center}
.book:hover .cover,.book:active .cover{transform:perspective(700px) rotateY(16deg) scale(1.03)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 45%,transparent 60%);transform:translateX(-120%);transition:transform 1s var(--ease)}
.book:hover .cover::after{transform:translateX(120%)}
.cover .ct{font-weight:800;font-size:12.5px;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.2);position:relative;z-index:1}
.cover .ca{font-size:9.5px;opacity:.92;font-weight:600;position:relative;z-index:1}
.cover svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%}
.cover .badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:8px;font-size:9.5px;font-weight:700;padding:3px 6px;z-index:2}
.book .bt{font-size:12px;margin-top:8px;line-height:1.35;font-weight:700}
.book .ba{font-size:11px;color:var(--muted)}
.bar{height:7px;background:rgba(124,92,255,.12);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;animation:grow 1.2s var(--ease) both}
@keyframes grow{from{width:0!important}}
/* highlights */
.hl{padding:20px 20px 14px}
.hl .q{font-size:17px;line-height:1.95}
.qmark{font-size:42px;line-height:.6;font-family:Georgia,serif;font-weight:700;display:block;height:22px}
.hl img,.hl video{width:100%;border-radius:18px;margin-top:6px;display:block;max-height:420px;object-fit:cover;background:#000}
.hl .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);gap:10px}
.heart{font-size:21px;transition:transform .4s var(--spring);color:var(--muted)}
.heart.on{color:#ff5c9a;animation:pop .5s var(--spring)}
@keyframes pop{50%{transform:scale(1.5)}}
/* review deck */
.deck{height:460px;position:relative;margin:8px 0 18px;perspective:1600px}
.rcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s var(--ease);cursor:grab;touch-action:pan-y}
.rcard.dragging{transition:none;cursor:grabbing}
.rcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--spring)}
.rcard.flipped .inner{transform:rotateY(180deg)}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;overflow:hidden}
.rfront{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,.78));box-shadow:0 30px 60px -20px rgba(108,82,200,.45);padding:28px;display:flex;flex-direction:column;justify-content:center;border:1px solid #fff}
.rback{transform:rotateY(180deg);color:#fff;box-shadow:0 30px 60px -20px rgba(60,40,140,.6)}
.rback .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rback .rbody{position:absolute;inset:0;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(20,14,50,.05) 20%,rgba(20,14,50,.72));overflow:auto}
.rface .q{font-size:20px;line-height:1.95}
.rface img,.rface video{max-width:100%;max-height:260px;border-radius:18px;align-self:center}
.ghostcard{position:absolute;inset:0;border-radius:32px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border:1px solid #fff;box-shadow:var(--gshadow)}
.ghostcard.g1{transform:translateY(14px) scale(.95)}
.ghostcard.g2{transform:translateY(28px) scale(.9);opacity:.6}
.stamp{position:absolute;top:26px;padding:6px 14px;border-radius:12px;border:3px solid;font-weight:800;letter-spacing:1px;opacity:0;z-index:5;background:rgba(255,255,255,.8)}
.stamp.keep{left:24px;color:#22b38a;transform:rotate(-12deg)}
.stamp.less{right:24px;color:#e0457b;transform:rotate(12deg)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dots i{flex:1;max-width:54px;height:5px;border-radius:9px;background:rgba(124,92,255,.15);overflow:hidden;position:relative}
.dots i.on::after{content:"";position:absolute;inset:0;background:var(--grad);animation:fill .6s var(--ease) both}
@keyframes fill{from{transform:translateX(-100%)}}
.big-n{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;transition:all .45s var(--spring)}
.cal .d:active{transform:scale(.85)}
.cal .d.out{opacity:.3}
.cal .d.today{color:var(--v1);font-weight:800}
.cal .d.sel{background:var(--grad);color:#fff;transform:scale(1.08);box-shadow:0 10px 18px -6px rgba(109,93,252,.7)}
.cal .d .ds{display:flex;gap:2px;height:5px;margin-top:2px}
.cal .d .ds i{width:5px;height:5px;border-radius:50%;background:var(--pk)}
.cal .d .ds i.j{background:var(--bl)}
.cal .d.sel .ds i{background:#fff}
/* charts */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.heat::-webkit-scrollbar{display:none}
.heat i{width:13px;height:13px;border-radius:4px;background:rgba(124,92,255,.09);animation:cell .5s var(--spring) both;cursor:pointer;transition:transform .3s var(--spring)}
.heat i:active{transform:scale(1.4)}
.heat i.l1{background:#d9ceff}.heat i.l2{background:#b7a1ff}.heat i.l3{background:#9273ff}.heat i.l4{background:#6d4ff0}
.heat i.t{outline:2px solid var(--pk);outline-offset:1px}
.heat i.sel{outline:2px solid var(--ink);outline-offset:1px}
@keyframes cell{from{transform:scale(0);opacity:0}}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:14px 12px;text-align:center;margin:0}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px}
.stat span{font-size:11px;font-weight:700;color:var(--muted)}
.area .line{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.6s var(--ease) .2s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.area .fill{animation:fadein 1.2s var(--ease) .6s both}
@keyframes fadein{from{opacity:0}}
.bubble{animation:bub .6s var(--spring) 1.3s both;transform-box:fill-box;transform-origin:center bottom}
@keyframes bub{from{transform:scale(0);opacity:0}}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--muted)}
.bars .b{width:100%;max-width:30px;border-radius:10px 10px 6px 6px;background:var(--grad);transform-origin:bottom;animation:barup .9s var(--spring) both;min-height:4px;box-shadow:0 8px 14px -8px rgba(109,93,252,.8)}
.bars .b.z{background:rgba(124,92,255,.12);box-shadow:none}
@keyframes barup{from{transform:scaleY(0)}}
.donut circle.s{animation:dash 1.5s var(--ease) both}
.leg{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.leg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.leg div span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg i{width:9px;height:9px;border-radius:50%;flex:none}
/* goals */
.goal{display:flex;gap:14px;align-items:flex-start}
.pring{flex:none;width:62px;height:62px;position:relative}
.pring svg{transform:rotate(-90deg)}
.pring circle.fg{animation:ring 1.4s var(--ease) both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.pring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.step{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
/* journal */
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{font-size:28px;flex:1;padding:8px 0;border-radius:16px;transition:all .45s var(--spring);filter:grayscale(1);opacity:.45}
.moods button.on{filter:none;opacity:1;background:rgba(124,92,255,.1);transform:scale(1.15) translateY(-3px)}
.entry{border-left:3px solid var(--v2);padding-left:14px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(40,28,90,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .35s}
.ov.out{animation:fadeOut .35s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(248,244,255,.94));backdrop-filter:blur(30px);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:34px 34px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .65s var(--spring);transition:transform .35s var(--ease);box-shadow:0 -20px 50px -20px rgba(80,60,170,.4)}
.ov.out .sheet{transform:translateY(100%)}
@keyframes up{from{transform:translateY(100%)}}
.grab{padding:8px 0 14px;cursor:grab;touch-action:none}
.grab i{display:block;width:44px;height:5px;border-radius:9px;background:rgba(120,100,190,.25);margin:0 auto}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:60;background:rgba(37,31,71,.88);backdrop-filter:blur(14px);color:#fff;padding:12px 18px;border-radius:20px;box-shadow:0 14px 30px rgba(40,28,90,.35);animation:drop .65s var(--spring);max-width:92vw;font-size:14px;font-weight:600}
@keyframes drop{from{transform:translate(-50%,-90px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* reader */
.reader{position:fixed;inset:0;z-index:55;background:radial-gradient(circle at 30% 0%,#3d2f7c,#15112e 70%);display:flex;flex-direction:column;animation:fade .35s}
.reader .rt{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
.reader .rt .iconbtn{background:rgba(255,255,255,.12);box-shadow:none;color:#fff;border-color:rgba(255,255,255,.15)}
.reader .stage{flex:1;display:grid;place-items:center;overflow:auto;perspective:2200px;padding:8px}
.reader canvas{max-width:100%;height:auto;background:#fff;border-radius:3px 10px 10px 3px;box-shadow:0 24px 60px rgba(0,0,0,.55);transform-origin:left center}
.reader .rb{display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);color:#fff}
.reader .rb .btn{flex:1}
.pg-next{animation:pgNext .6s var(--ease)}
.pg-prev{animation:pgPrev .6s var(--ease)}
@keyframes pgNext{0%{transform:rotateY(-85deg);opacity:.2}100%{transform:none}}
@keyframes pgPrev{0%{transform:rotateY(85deg);opacity:.2}100%{transform:none}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:46px;margin-bottom:8px;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:20px}
.pri{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pri b{flex:none;width:30px;height:30px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 6px 12px -4px rgba(109,93,252,.6)}
.daycol{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .4s var(--spring)}
.daycol:active{transform:scale(.98)}
.daycol:last-child{border-bottom:0}
.daycol .dn{width:46px;text-align:center}
.daycol .dn b{display:block;font-size:20px;font-weight:800}
.daycol.today .dn b{color:var(--v1)}
.prio{display:flex;gap:8px}
.prio button{flex:1;padding:10px;border-radius:13px;background:rgba(124,92,255,.08);font-size:13px;font-weight:700;transition:all .45s var(--spring)}
.prio button.on{color:#fff;background:var(--c);transform:scale(1.05)}
.typepick{display:flex;gap:8px;margin-bottom:6px}
.typepick button{flex:1;padding:12px 6px;border-radius:16px;background:rgba(124,92,255,.08);font-size:13px;font-weight:700;transition:all .45s var(--spring)}
.typepick button.on{background:var(--grad);color:#fff;transform:scale(1.04)}
.preview img,.preview video{width:100%;border-radius:18px;margin-top:8px;max-height:260px;object-fit:cover}
.navbtns{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.navbtns h3{margin:0;text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick button{padding:20px 10px;text-align:center;font-weight:700;margin:0;animation:rise .6s var(--ease) both}
.quick button:nth-child(2){animation-delay:.06s}.quick button:nth-child(3){animation-delay:.12s}.quick button:nth-child(4){animation-delay:.18s}
.quick .ic{width:52px;height:52px;border-radius:18px;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 10px 18px -8px var(--sh)}
.scenes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scenes button{border-radius:14px;overflow:hidden;height:64px;position:relative;font-size:10px;font-weight:700;color:#fff;transition:transform .45s var(--spring)}
.scenes button .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scenes button span{position:absolute;left:0;right:0;bottom:4px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.scenes button.on{outline:3px solid var(--v1);outline-offset:2px;transform:scale(1.05)}

/* home sky hero (reference 2) */
body.home .top{display:none}
.homehero{position:relative;margin:calc(-12px - env(safe-area-inset-top)) -18px 0;height:360px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.homehero .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.homehero .hh{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 18px) 20px 0;display:flex;flex-direction:column}
.homehero .hrow{display:flex;justify-content:space-between;align-items:center}
.pills{display:flex;gap:8px}
.pills span{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12.5px;font-weight:700;color:var(--ink);border:1px solid rgba(255,255,255,.7)}
.homehero .greet{margin-top:auto;padding-bottom:96px;text-align:center}
.homehero .greet h1{font-size:30px;margin:0}
.homehero .greet p{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink2)}
.homehero.dark .greet h1,.homehero.dark .greet p{color:#fff;text-shadow:0 2px 14px rgba(20,10,60,.45)}
.lift{margin-top:-84px;position:relative;z-index:2}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.mini>div{border-radius:18px;padding:12px;font-size:13px;font-weight:600;line-height:1.35;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;animation:rise .7s var(--ease) both}
.mini .lav{background:#e7e0fa}.mini .mint{background:#d9f1e3}.mini .peach{background:#ffe6d6}.mini .sky{background:#dde8ff}
.mini small{font-size:11px;color:var(--muted);font-weight:600}
.btn.indigo{background:var(--grad);color:#fff;box-shadow:0 12px 24px -10px rgba(63,72,216,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.outline{border:1.5px solid var(--v1);color:var(--v1);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px;background:rgba(255,255,255,.6);transition:transform .45s var(--spring)}
.outline:active{transform:scale(.92)}
.count{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(79,86,232,.35);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--v1)}
/* body page */
.fast{display:flex;flex-direction:column;align-items:center;text-align:center}
.fring{position:relative;width:230px;height:230px;margin:6px auto 10px}
.fring svg{transform:rotate(-90deg)}
.fring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fring .c b{font-size:38px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.fring .c span{font-size:12px;font-weight:700;color:var(--muted)}
.fring .fg{transition:stroke-dashoffset 1s linear}
.plans{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:2px 18px 8px;scrollbar-width:none}
.plans::-webkit-scrollbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;width:100%}
.kpis div{background:rgba(79,86,232,.06);border-radius:14px;padding:10px 6px;font-size:11px;font-weight:700;color:var(--muted)}
.kpis b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro div{font-size:12px;font-weight:700;color:var(--muted)}
.macro b{display:block;color:var(--ink);font-size:14px;margin:2px 0 6px}
.food{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food img{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none}
.food .fi{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;background:#ffe6d6}
.snap{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,#3f48d8,#7a5cff 60%,#e98bd8);box-shadow:0 20px 40px -18px rgba(63,72,216,.8);margin-bottom:14px}
.snap::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);right:-60px;top:-80px}
.snap>*{position:relative;z-index:1}
.scan{position:relative;border-radius:22px;overflow:hidden;margin-bottom:12px}
.scan img{width:100%;display:block;max-height:300px;object-fit:cover}
.scan .beam{position:absolute;left:0;right:0;height:70px;background:linear-gradient(180deg,transparent,rgba(122,92,255,.55),transparent);animation:beam 1.6s ease-in-out infinite alternate}
@keyframes beam{from{top:-70px}to{top:100%}}
.nrow{display:grid;grid-template-columns:1fr 64px 52px 52px 52px;gap:6px;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.nrow input{padding:7px 6px;border-radius:10px;font-size:12.5px;text-align:center}
.nrow input.nm{text-align:left}

.sel3{display:flex;gap:8px;flex-wrap:wrap}
.sel3 button{padding:9px 13px;border-radius:12px;background:rgba(79,86,232,.07);font-size:13px;font-weight:700;transition:all .4s var(--spring)}
.sel3 button.on{background:var(--grad);color:#fff}


/* food library */
.lrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);animation:rise .4s var(--ease) both}
.lrow .le{width:40px;height:40px;border-radius:13px;background:rgba(79,86,232,.07);display:grid;place-items:center;font-size:20px;flex:none}
.lrow .lt{flex:1;min-width:0;cursor:pointer}
.lrow .lt b{font-size:14px;font-weight:700}
.lrow .lt .ar{font-size:13px;color:var(--ink2)}

/* focus */

.pdots i{width:9px;height:9px;border-radius:50%;background:rgba(79,86,232,.15);transition:all .4s var(--spring)}
.pdots i.on{background:var(--grad);transform:scale(1.15)}

.tiles{grid-template-columns:repeat(5,1fr)!important;gap:6px!important}

/* stronger mirror glass: more visible cards (Nov 2026) */
.g{background:linear-gradient(135deg,color-mix(in srgb,var(--v1) 13%,rgba(255,255,255,.9)),color-mix(in srgb,var(--v1) 22%,rgba(255,255,255,.76)))!important;backdrop-filter:blur(30px) saturate(1.7)!important;-webkit-backdrop-filter:blur(30px) saturate(1.7)!important;border:1px solid color-mix(in srgb,var(--v1) 18%,#fff)!important;box-shadow:inset 0 1px 0 #fff,0 0 0 1px color-mix(in srgb,var(--v1) 14%,transparent),0 24px 46px -18px color-mix(in srgb,var(--v1) 45%,rgba(40,20,110,.5)),0 3px 10px rgba(40,20,110,.08)!important}
html.dark .g{background:linear-gradient(135deg,color-mix(in srgb,var(--v1) 16%,rgba(20,15,46,.8)),color-mix(in srgb,var(--v1) 10%,rgba(12,9,30,.7)))!important;border-color:rgba(255,255,255,.16)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px rgba(0,0,0,.25),0 26px 50px -18px rgba(0,0,0,.75)!important}
.nav-in{background:linear-gradient(135deg,color-mix(in srgb,var(--v1) 12%,rgba(255,255,255,.93)),color-mix(in srgb,var(--v1) 8%,rgba(255,255,255,.84)))!important;box-shadow:0 18px 40px -12px color-mix(in srgb,var(--v1) 45%,rgba(40,20,110,.5)),inset 0 1px 0 #fff!important}
html.dark .nav-in{background:linear-gradient(135deg,color-mix(in srgb,var(--v1) 22%,rgba(16,12,40,.92)),color-mix(in srgb,var(--v1) 12%,rgba(10,8,28,.88)))!important}

/* calendar v2: multi-day bars, clearer cells */
.calh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin:10px 0 6px}
.calh div{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em}
.wk{display:grid;grid-template-columns:repeat(7,1fr);column-gap:3px;margin-bottom:4px}
.cd{position:relative;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 4px;font-size:14px;font-weight:700;color:inherit;background:transparent;border:0;transition:background .3s,transform .35s var(--spring)}
.cd:active{transform:scale(.92)}
.cd.we{background:color-mix(in srgb,var(--v1) 6%,transparent)}
.cd .dn{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;line-height:1}
.cd.out .dn,.cd.out .ds{opacity:.3}
.cd.today .dn{background:color-mix(in srgb,var(--v1) 18%,transparent);color:var(--v1);box-shadow:inset 0 0 0 1.5px var(--v1)}
.cd.sel{background:var(--grad)!important;color:#fff;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--v1) 75%,transparent)}
.cd.sel .dn{background:rgba(255,255,255,.25);color:#fff;box-shadow:none}
.cd .ds{display:flex;gap:3px;height:6px;align-items:center}
.cd .ds i{width:6px;height:6px;border-radius:50%;background:var(--pk)}
.cd .ds i.j{background:var(--bl)}
.cd .ds em.ok,.calleg em.okl{font-style:normal;font-size:10px;font-weight:900;line-height:6px;color:#1fbf8a}.calleg em.okl{font-size:12px;line-height:1}.cd.sel .ds em.ok{color:#fff}
.cd.sel .ds i{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cd .more{position:absolute;right:3px;bottom:1px;font-size:9px;font-weight:800;opacity:.75}
.bar2{z-index:1;pointer-events:none;align-self:center;height:15px;margin:0 -2px;background:var(--tc);color:#fff;font-size:10px;font-weight:700;line-height:15px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 8px -3px color-mix(in srgb,var(--tc) 80%,transparent),inset 0 0 0 1px rgba(255,255,255,.25)}
.bar2.h{border-top-left-radius:8px;border-bottom-left-radius:8px;margin-left:3px}
.bar2.tl{border-top-right-radius:8px;border-bottom-right-radius:8px;margin-right:3px}
.bar2.dn{opacity:.45;text-decoration:line-through}
.calleg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.calleg span{display:flex;align-items:center;gap:5px}
.calleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.calleg b{width:18px;height:8px;border-radius:5px;background:linear-gradient(90deg,#ff5c9a,#7c5cff);display:inline-block}
.task.tcol{box-shadow:inset 4px 0 0 var(--tc);padding-left:12px;border-radius:4px}
.tprog{height:4px;border-radius:4px;background:color-mix(in srgb,var(--tc) 18%,transparent);margin-top:7px;overflow:hidden;max-width:220px}
.tprog i{display:block;height:100%;background:var(--tc);border-radius:4px;transition:width .5s var(--ease)}
.tag.rtag{background:color-mix(in srgb,var(--tc,#7c5cff) 16%,transparent)!important;color:var(--tc,#7c5cff)!important;margin-right:4px}
.spanl{font-size:13px;margin-top:8px;color:var(--muted)}
.spanl b{color:var(--v1)}
.tcolors{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.tcolors button{width:28px;height:28px;border-radius:10px;border:0;transition:transform .3s var(--spring);box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.tcolors button.none{width:auto;padding:0 8px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--v1) 12%,#fff);color:var(--v1)}
.tcolors button.on{outline:3px solid currentColor;outline-offset:2px;transform:scale(1.1)}
.tcolors button:not(.none).on{outline-color:#16121c}
html.dark .tcolors button:not(.none).on{outline-color:#fff}
.wdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ===== game layer ===== */
.xppop{position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:120;font-weight:900;font-size:26px;color:#fff;background:var(--grad);padding:8px 18px;border-radius:999px;box-shadow:0 14px 30px -10px color-mix(in srgb,var(--v1) 80%,transparent);animation:xpup 1.4s var(--ease) forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(.9)}}
.celeb{position:fixed;inset:0;z-index:130;display:grid;place-items:center;background:rgba(20,10,40,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .35s}
.celeb.in{opacity:1}.celeb .cb{background:#fff;color:#1a1530;border-radius:28px;padding:26px 28px;text-align:center;max-width:300px;transform:scale(.7);transition:transform .5s var(--spring);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.celeb.in .cb{transform:scale(1)}.celeb .ce{font-size:64px;line-height:1;margin-bottom:10px;animation:bob 1.6s ease-in-out infinite}.celeb b{display:block;font-size:19px}.celeb small{display:block;color:#6b6585;margin-top:6px;line-height:1.4}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
html.dark .celeb .cb{background:#221c4a;color:#fff}html.dark .celeb small{color:#b9b3d6}
.lvl{margin-top:14px;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;border:1px solid rgba(255,255,255,.25)}
.lvl b{font-size:14px}.lvl small{font-size:11.5px;opacity:.85}.lbar{height:7px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:7px;overflow:hidden}.lbar i{display:block;height:100%;border-radius:6px;background:#fff;transition:width .8s var(--ease)}
.gstrip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.gs{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--v1) 12%,rgba(255,255,255,.85));border:1px solid color-mix(in srgb,var(--v1) 20%,#fff);color:inherit}
html.dark .gs{background:color-mix(in srgb,var(--v1) 20%,rgba(18,14,44,.85));border-color:rgba(255,255,255,.12)}
.gs span{grid-row:1/3;font-size:26px}.gs b{font-size:15px}.gs small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bdg{text-align:center;padding:12px 6px;border-radius:18px;background:rgba(0,0,0,.04);opacity:.55}.bdg.on{opacity:1;background:color-mix(in srgb,var(--v1) 12%,transparent)}
html.dark .bdg{background:rgba(255,255,255,.05)}.bdg span{font-size:30px;display:block}.bdg b{display:block;font-size:12px;margin-top:4px}.bdg small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.giftrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.giftrow .ge{font-size:30px}.giftrow.got .ge{animation:bob 1.6s ease-in-out infinite}
.giftbox{display:grid;place-items:center;height:190px}.gb{position:relative;width:120px;height:120px}
.gb .box{position:absolute;bottom:0;left:10px;width:100px;height:72px;border-radius:10px;background:linear-gradient(135deg,#ff7eb6,#a855f7)}
.gb .lid{position:absolute;top:30px;left:2px;width:116px;height:26px;border-radius:8px;background:linear-gradient(135deg,#ff9cc6,#c084fc);z-index:2;transition:transform .7s var(--spring)}
.gb .rib{position:absolute;bottom:0;left:52px;width:16px;height:98px;background:#ffd166;z-index:3;border-radius:3px;transition:opacity .4s}
.gb .gift-e{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:54px;z-index:1;transform:scale(.3);opacity:0;transition:all .8s var(--spring) .25s}
.giftbox.open .lid{transform:translateY(-70px) rotate(-24deg)}.giftbox.open .rib{opacity:0}.giftbox.open .gift-e{transform:translateY(-60px) scale(1.2);opacity:1}
/* ===== home journeys ===== */
.jrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 18px}
.jc{position:relative;overflow:hidden;text-align:left;padding:14px 14px 18px;border-radius:24px;color:#fff;display:flex;flex-direction:column;gap:2px;box-shadow:0 18px 30px -16px rgba(20,20,60,.55)}
.jc .je{font-size:26px;margin-bottom:4px}.jc b{font-size:15px}.jc small{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc i{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.85);border-radius:0 4px 4px 0}
.jmed{background:linear-gradient(135deg,#2dd4bf,#0e7490 60%,#1e3a8a)}.jocd{background:linear-gradient(135deg,#f9a8d4,#a78bfa 55%,#60a5fa)}
/* ===== Medical page ===== */
.medp{--v1:#0d9488;--v2:#0e7490;--grad:linear-gradient(135deg,#2dd4bf 0%,#0e7490 55%,#1e3a8a 100%)}
html.dark .medp{--v1:#2dd4bf}
.mhero{position:relative;overflow:hidden;border-radius:30px;padding:20px 18px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(140deg,#14b8a6 0%,#0e7490 50%,#1e3a8a 100%);box-shadow:0 26px 44px -22px rgba(14,116,144,.8)}
.mhero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%)}
.ecg{position:absolute;left:0;right:0;top:44%;width:100%;height:60px;opacity:.28;pointer-events:none}.ecg path{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:700;stroke-dashoffset:700;animation:ecg 3.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-700}}
.mh-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}.mh-d{font-size:16px;margin-top:2px}.mh-d b{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.05}.mh-s{font-size:13px;opacity:.85}
.mh-app{position:relative;margin-top:12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:8px 12px;border-radius:12px;display:inline-block}
.mring,.ostat{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0);flex:none}
.mring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0f6f86}.mring b,.mring small{position:relative;line-height:1}.mring b{font-size:18px}.mring small{font-size:10px;opacity:.85;margin-top:2px}
.mtl{margin-top:8px}.mti{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.mti:last-child{border-bottom:0}
.mti.done .mtt b{text-decoration:line-through;color:var(--muted)}.mic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none;box-shadow:0 8px 14px -8px rgba(0,0,0,.4)}
.mtt{flex:1;min-width:0}.mtt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mtt small{color:var(--muted);font-size:12px}
.mok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#14b8a6;color:#fff;font-weight:900;flex:none}
.akin{width:64px!important;height:34px;padding:0 8px!important;border-radius:10px!important;text-align:center;flex:none}
.mwarn{margin:10px 0 2px;padding:10px 12px;border-radius:14px;background:#fff4e6;color:#9a4b00;font-size:13px;font-weight:600}.mwarn button{color:#c2410c;font-weight:800;margin-left:4px}
html.dark .mwarn{background:rgba(251,146,60,.15);color:#fdba74}
.mempty{text-align:center}.mempty h3{margin:8px 0 4px}
.srings{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}.srings::-webkit-scrollbar{display:none}
.sring{flex:none;text-align:center;width:62px}.sring small{display:block;font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 14%,transparent) 0);position:relative}
.sr::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card,#fff)}html.dark .sr::before{background:#1b1640}.sr b{position:relative;font-size:12px}
.chrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.chrow .t{flex:1;min-width:0;cursor:pointer}.chrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow small{color:var(--muted);font-size:11.5px}.chrow.done b{text-decoration:line-through;color:var(--muted)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.chpv{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0}.chpv span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbrow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d n p" "b b b";column-gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.sbrow:last-child{border-bottom:0}.sbrow .sdot{grid-area:d}.sbrow b{grid-area:n;font-weight:600}.sbrow>.muted:nth-of-type(1){grid-area:p}.sbrow>.muted:last-child:not(:nth-of-type(1)){display:none}
.sbbar{grid-area:b;height:5px;border-radius:4px;background:rgba(0,0,0,.06);margin-top:6px;overflow:hidden}html.dark .sbbar{background:rgba(255,255,255,.08)}.sbbar i{display:block;height:100%;border-radius:4px}
.exbars{display:flex;align-items:flex-end;gap:5px;height:80px;margin-top:14px}.exbars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.exbars i{width:100%;border-radius:6px 6px 3px 3px;display:block}.exbars small{font-size:9.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}.ocdp .kpis{grid-template-columns:repeat(3,1fr)}
.kpis b{display:block;font-size:19px;font-weight:800}.kpis small{font-size:10.5px;color:var(--muted)}
.ahm{display:grid;grid-template-columns:repeat(21,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:14px}.ahm i{aspect-ratio:1;border-radius:3px;background:#2563eb}
/* exam */
.exam{padding-bottom:6px}.exh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.exdots{flex:1;display:flex;gap:4px}
.exdots i{flex:1;height:6px;border-radius:4px;background:rgba(0,0,0,.08)}html.dark .exdots i{background:rgba(255,255,255,.12)}.exdots i.cur{background:var(--v1)}.exdots i.ok{background:#14b8a6}.exdots i.no{background:#f43f5e}
.exsub{display:flex;align-items:center;font-size:12.5px;font-weight:700;margin-bottom:10px}
.exq{font-size:16px;line-height:1.65;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--v1) 7%,rgba(255,255,255,.7));border:1px solid color-mix(in srgb,var(--v1) 14%,transparent)}
html.dark .exq{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.exq img,.exex img,.exans img{max-width:100%;border-radius:12px;margin:8px 0;display:block}.exq ul,.exex ul{padding-left:20px;margin:6px 0}.exq table{border-collapse:collapse;font-size:13px;margin:6px 0}.exq td,.exq th{border:1px solid var(--line);padding:4px 6px}
.qb{display:inline-block;min-width:54px;padding:1px 10px;margin:0 2px;border-radius:8px;background:color-mix(in srgb,var(--v1) 18%,transparent);color:var(--v1);font-weight:800;text-align:center;border-bottom:2px dashed var(--v1)}
.qa{padding:1px 6px;border-radius:7px;background:rgba(20,184,166,.18);color:#0f766e;font-weight:800}html.dark .qa{color:#5eead4}
.exopts{display:grid;gap:9px;margin-top:14px}
.exo{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--v1) 18%,var(--line));background:rgba(255,255,255,.75);font-size:14.5px;font-weight:600;color:inherit;transition:transform .25s var(--spring),background .25s,border-color .25s}
html.dark .exo{background:rgba(255,255,255,.05)}.exo:active{transform:scale(.97)}
.exo b{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--v1) 14%,transparent);color:var(--v1)}
.exo.right{background:rgba(20,184,166,.14);border-color:#14b8a6;animation:pulse .5s var(--spring)}.exo.right b{background:#14b8a6;color:#fff}
.exo.wrong{background:rgba(244,63,94,.12);border-color:#f43f5e;animation:shake .4s}.exo.wrong b{background:#f43f5e;color:#fff}.exo.dim{opacity:.5}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.exans{margin-top:12px;padding:14px;border-radius:16px;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.35);font-size:14.5px;line-height:1.6}
.exex{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.035);font-size:13.5px;line-height:1.6}html.dark .exex{background:rgba(255,255,255,.05)}.exex summary{font-weight:800;cursor:pointer;margin-bottom:4px}
.scorering{width:150px;height:150px;margin:16px auto 10px;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 15%,transparent) 0);position:relative;animation:pop .7s var(--spring)}
.scorering::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}html.dark .scorering::before{background:#221c4a}.scorering b,.scorering small{position:relative;line-height:1}.scorering b{font-size:38px;font-weight:900}.scorering small{color:var(--muted);margin-top:4px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.xpbig{display:inline-block;margin-top:8px;font-weight:900;font-size:20px;color:#fff;background:var(--grad);padding:8px 18px;border-radius:999px}
/* ===== OCD Journey ===== */
.ocdp{--v1:#8b5cf6;--v2:#ec4899;--grad:linear-gradient(135deg,#f472b6 0%,#a78bfa 55%,#60a5fa 100%)}
html.dark .ocdp{--v1:#a78bfa}
.ohero{position:relative;overflow:hidden;border-radius:30px;padding:20px 18px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(160deg,#fbcfe8 -10%,#c084fc 45%,#6366f1 110%);box-shadow:0 26px 44px -22px rgba(139,92,246,.8)}
.osun{position:absolute;right:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fde68a 0%,rgba(253,186,116,.6) 40%,transparent 70%);animation:sunb 6s ease-in-out infinite}
@keyframes sunb{50%{transform:translateY(-10px) scale(1.05)}}

.dday{padding:6px 8px 2px}.dday small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.dday b{font-size:26px;font-weight:900}
.dcard{padding:16px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--v1) 8%,rgba(255,255,255,.88)),color-mix(in srgb,var(--v1) 12%,rgba(255,255,255,.72)));backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.85);box-shadow:0 18px 36px -22px rgba(40,20,110,.4)}

.dcard>.row b{font-size:15px}.mnav{width:28px;height:28px;border-radius:9px;font-size:18px;font-weight:800;color:var(--muted)}.mnav:hover{background:color-mix(in srgb,var(--v1) 10%,transparent)}
.mch,.mcg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.mch{margin:10px 0 4px}.mch span{font-size:10.5px;font-weight:800;color:var(--muted)}
.mc{height:38px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:inherit;transition:background .2s}
.mc:hover{background:color-mix(in srgb,var(--v1) 10%,transparent)}.mc.out{opacity:.3}.mc.td span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff}

.dtasks{margin-top:6px}.dtasks .task{padding:8px 0}.dcard .quickadd{margin-top:8px}

/* sheets become centred dialogs on a laptop */
body.desk .ov{align-items:center;justify-content:center}
body.desk .sheet{max-width:620px;max-height:88vh;border-radius:30px;padding-bottom:24px;animation:dpop .5s var(--spring)}
@keyframes dpop{from{opacity:0;transform:translateY(24px) scale(.96)}}
body.desk .sheet.xfull{max-width:780px;height:92vh;max-height:92vh;border-radius:32px;padding:18px 26px 0}

body.desk .greet h1{font-size:40px}

.isteps{padding-left:20px;line-height:1.7;font-size:14.5px}.isteps li{margin-bottom:6px}

/* installed laptop app: no title bar — the background runs to the top, window buttons float over it */
.wco{display:none}
@media (display-mode: window-controls-overlay){
 :root{--tb:env(titlebar-area-height,32px)}
 body{padding-top:var(--tb)}
 .wco{display:block;position:fixed;left:env(titlebar-area-x,0);top:env(titlebar-area-y,0);width:env(titlebar-area-width,100%);height:var(--tb);-webkit-app-region:drag;app-region:drag;z-index:15}
 body.desk .dside,body.desk .dright{top:calc(var(--tb) + 6px)}

 .reader{top:var(--tb)}
 .toast{top:calc(var(--tb) + 14px)}
 .sheet.xfull{height:calc(100dvh - var(--tb));max-height:calc(100dvh - var(--tb))}
 body.desk .sheet{max-height:calc(88vh - var(--tb))}
 body.desk .sheet.xfull{height:calc(92vh - var(--tb));max-height:calc(92vh - var(--tb))}
}

.sndgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}

.sndt.on i{animation:sndb 2.6s ease-in-out infinite}
@keyframes sndb{50%{transform:translateY(-2px) scale(1.08)}}
.sndt:active{transform:scale(.94)}
.sndt.ld::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.sndt.ld i{animation:sndl 1s ease-in-out infinite}
@keyframes sndl{50%{opacity:.45;transform:scale(.9)}}
.sndvols{margin-top:14px;display:grid;gap:10px}
.sndv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;align-items:center;gap:12px;font-size:13px;font-weight:700;color:var(--ink)}
.sndr{width:100%;accent-color:var(--v1)}

/* date heading on the right stays readable over busy wallpapers */
body.desk .dday b,body.desk .dday small{text-shadow:0 0 14px rgba(255,255,255,.85),0 0 3px rgba(255,255,255,.7)}
html.dark body.desk .dday b,html.dark body.desk .dday small{text-shadow:0 0 14px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}

/* laptop: show wallpapers still and pixel-sharp (the slow zoom made them look soft) */
body.desk #bgimg.wide img{animation:none;transform:none;will-change:auto}

        snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=JSON.parse(JSON.stringify(v))});S.items=next;

function revCount(k){const m=meta();const c=(m.revCount||{})[k];if(c!=null)return c;return (m.reviewed||[]).includes(k)?5:0}
function doneOn(k){return all("task").reduce((n,t)=>n+(isRange(t)?((t.doneDays||[]).includes(k)?1:0):(t.done&&(t.doneAt?dkey(new Date(t.doneAt))===k:t.date===k)?1:0)),0)}
function jourOn(k){return all("journal").filter(j=>j.date===k).length}
function activity(k,m){m=m||"all";return m==="rev"?revCount(k):m==="task"?doneOn(k):revCount(k)+doneOn(k)+jourOn(k)}
function streak(){const set=new Set(meta().reviewed||[]);let d=new Date();if(!set.has(dkey(d)))d=addDays(d,-1);let n=0;while(set.has(dkey(d))){n++;d=addDays(d,-1)}return n}

function areaChart(vals,labels,h,o){

  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` C${x0+dx/2} ${y0},${x1-dx/2} ${y1},${x1} ${y1}`}

  const bx=Math.min(Math.max(mx,26),W-26);

function heatmap(metric){
  const weeks=22;const end=new Date();const start=addDays(weekStart(end),-(weeks-1)*7);let cells="",n=0;
  const vals=[];for(let i=0;i<weeks*7;i++){const d=addDays(start,i);if(d>end)break;vals.push(activity(dkey(d),metric))}
  const mx=Math.max(1,...vals);
  for(let i=0;i<weeks*7;i++){const d=addDays(start,i);const k=dkey(d);if(d>end){cells+=`<i style="visibility:hidden"></i>`;continue}
    const v=vals[n++];const l=v?Math.min(4,Math.ceil(v/mx*4)):0;
    cells+=`<i class="${l?"l"+l:""} ${k===today()?"t":""} ${k===S.heatSel?"sel":""}" data-act="heat" data-v="${k}" style="animation-delay:${Math.floor(i/7)*22}ms" title="${k}: ${v}"></i>`}
  return `<div class="heat" id="heat">${cells}</div>`;
}
function donut(goals){
  const R=46,C=2*Math.PI*R;const tot=goals.length;let acc=0,segs="";
  const overall=tot?Math.round(goals.reduce((s,g)=>s+goalProgress(g),0)/tot):0;
  goals.forEach((g,i)=>{const share=1/tot;const len=C*share*(goalProgress(g)/100);const gap=C*share-len;
    segs+=`<circle class="s" cx="60" cy="60" r="${R}" fill="none" stroke="rgba(124,92,255,.1)" stroke-width="14" stroke-dasharray="${C*share-3} ${C}" stroke-dashoffset="${-acc}"/>`;
    if(len>0)segs+=`<circle class="s" cx="60" cy="60" r="${R}" fill="none" stroke="${g.color||GCOLORS[i%6]}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${Math.max(len-3,1)} ${C}" stroke-dashoffset="${-acc}" style="animation-delay:${i*.15}s"/>`;
    acc+=C*share});
  return `<div class="row" style="gap:18px"><div style="position:relative;width:130px;height:130px;flex:none"><svg viewBox="0 0 120 120" width="130" height="130" class="donut" style="transform:rotate(-90deg)">${segs||`<circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(124,92,255,.1)" stroke-width="14"/>`}</svg>
   <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><b style="font-size:26px;font-weight:800;letter-spacing:-1px" data-count="${overall}" data-suf="%">${overall}%</b><div class="muted" style="font-size:11px;font-weight:700">Completed</div></div></div></div>

   <div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" id="ai-stop">Stop</button><button class="btn soft" style="flex:1" id="ai-again">Re-analyse</button></div>`,el=>{

      out.innerHTML=`<div class="muted" style="margin-top:14px;text-align:center">Looking at your plate…</div>`;

Reply with ONLY a JSON object, no other text, in exactly this shape:
{"meal":"short meal name","items":[{"name":"food name","portion":"e.g. 1 cup (180 g)","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0}],"confidence":"low|medium|high","notes":"one short sentence on your main assumptions"}
Use whole numbers; macros in grams. If there is no food in the photo, return {"meal":"","items":[],"confidence":"low","notes":"No food detected"}.`;
      try{

        const items=Array.isArray(r&&r.items)?r.items.map(x=>({name:String(x.name||"Item"),portion:String(x.portion||""),kcal:+x.kcal||0,p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0,fib:+x.fiber||0})):[];
        if(!items.length){out.innerHTML=`<div class="g" style="margin-top:14px;text-align:center">🤔 ${esc(r&&r.notes||"No food detected")}<br><br><button class="btn soft" data-act="foodAdd">Add manually</button></div>`;return}
        showNutrition(out,items,r,file);sfx("chime");
      }catch(e){beam.style.display="none";if(e&&e.code==="cancelled"){out.innerHTML=`<div class="muted" style="margin-top:14px;text-align:center">Stopped.</div>`;return}
        const msg={not_granted:"You didn't allow the app to use Claude — you can add the meal manually.",rate_limited:"Too many requests right now — try again in a little while.",image_rejected:"That photo couldn't be read — try another one.",refused:"Claude couldn't analyse this photo.",invalid_json:"The answer came back garbled — tap Re-analyse.",images_unavailable:"Photo analysis isn't available here."}[e&&e.code]||"Something went wrong — tap Re-analyse.";
        out.innerHTML=`<div class="g" style="margin-top:14px;text-align:center">${msg}<br><br><button class="btn soft" data-act="foodAdd">Add manually</button></div>`}
    };

let FL={cat:"eg",q:""};
function libItems(){
  const q=FL.q.trim().toLowerCase();
  const mine=all("myfood").map(m=>({fid:"m_"+m.id,en:m.en,ar:m.ar||"",sv:m.sv||"1 serving",kcal:m.kcal,p:m.p,c:m.c,f:m.f,cat:"mine",mid:m.id}));
  if(q)return mine.concat(FOODLIST).filter(x=>(x.en+" "+x.ar+" "+x.sv).toLowerCase().includes(q)).slice(0,80);
  if(FL.cat==="mine")return mine;
  if(FL.cat==="recent"){const seen=new Set();return all("food").sort((a,b)=>(b.created||0)-(a.created||0)).filter(f=>{const k=f.name+"|"+f.sv;if(seen.has(k))return false;seen.add(k);return true}).slice(0,20)
    .map(f=>({fid:"r_"+f.id,en:f.name,ar:f.ar||"",sv:f.sv||(f.mult&&f.mult!==1?"×"+f.mult:"as logged"),kcal:f.kcal,p:f.p,c:f.c,f:f.f,cat:f.cat||"recent"}))}
  return FOODLIST.filter(x=>x.cat===FL.cat);
}
function libRow(x){return `<div class="lrow" data-fid="${x.fid}"><span class="le">${FEMO[x.cat]||"🍴"}</span><div class="lt" data-lact="qty"><b dir="auto">${esc(x.en)}</b>${x.ar&&x.ar!==x.en?` <span class="ar" dir="rtl">${esc(x.ar)}</span>`:""}<div class="muted">${esc(x.sv)} · P ${Math.round(x.p)} · C ${Math.round(x.c)} · F ${Math.round(x.f)}</div></div><span class="lk">${Math.round(x.kcal)}<small>kcal</small></span><button class="ladd" data-lact="add" aria-label="Add">+</button></div>`}
function addFromLib(x,mult){
  mult=mult||1;const r=v=>Math.round(v*mult*10)/10;
  put({kind:"food",id:uid(),date:today(),name:x.en,ar:x.ar,sv:mult===1?x.sv:`${mult===.5?"½":mult} × ${x.sv}`,mult,cat:x.cat==="recent"?"":x.cat,kcal:Math.round(x.kcal*mult),p:r(x.p),c:r(x.c),f:r(x.f),created:Date.now()},true);
  render();
}
function foodLibSheet(){
  sheet(`<div class="row between"><h3 style="font-size:20px;margin:0">Food library</h3><span class="tag" id="fl-tot"></span></div>
   <div class="g search" style="margin:12px 0 10px">${ico("search")}<input type="search" id="fl-q" placeholder="Search — koshari, كشري, latte…" value="${esc(FL.q)}" autocomplete="off"></div>
   <div class="chips" id="fl-cats" style="margin:0 -20px;padding-left:20px;padding-right:20px">${FCATS.map(([k,n])=>`<button class="chip ${FL.cat===k&&!FL.q?"on":""}" data-c="${k}">${n}</button>`).join("")}</div>
   <div id="fl-list"></div>
   <div class="muted" style="margin-top:12px;font-size:12px">Values are typical averages per serving — packaged products vary by brand. Tap a food to change the amount, or + to add one serving.</div>
   <button class="btn soft block" style="margin-top:12px" id="fl-manual">✍️ Add a food that's not here</button>`,el=>{
    const list=el.querySelector("#fl-list");
    const tot=()=>{const t=sumF(foodsOn(today()));const ct=calTarget();el.querySelector("#fl-tot").textContent=`Today ${Math.round(t.kcal)} / ${ct?ct.target:2000} kcal`};
    const draw=()=>{const items=libItems();list.innerHTML=items.length?items.map(libRow).join(""):`<div class="empty" style="padding:20px">${FL.cat==="mine"&&!FL.q?"Foods you save from “Add a food that's not here” show up here.":FL.cat==="recent"&&!FL.q?"Foods you log show up here for quick re-adding.":"Nothing found — add it manually below."}</div>`;tot()};
    const find=fid=>libItems().find(x=>x.fid===fid);
    el.querySelector("#fl-q").oninput=e=>{FL.q=e.target.value;el.querySelectorAll("#fl-cats .chip").forEach(c=>c.classList.toggle("on",!FL.q&&c.dataset.c===FL.cat));draw()};
    el.querySelector("#fl-cats").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;FL.cat=c.dataset.c;FL.q="";el.querySelector("#fl-q").value="";el.querySelectorAll("#fl-cats .chip").forEach(x=>x.classList.toggle("on",x===c));sfx("tick");draw()};
    list.onclick=e=>{const a=e.target.closest("[data-lact]");if(!a)return;const row=a.closest(".lrow");const x=find(row.dataset.fid);if(!x)return;
      if(a.dataset.lact==="add"){addFromLib(x,1);a.classList.add("ok");a.textContent="✓";burst(a,"#5a5cf0");setTimeout(()=>{a.classList.remove("ok");a.textContent="+"},1300);toast(`+${Math.round(x.kcal)} kcal · ${x.en}`,1600);tot()}
      else{const open=row.nextElementSibling&&row.nextElementSibling.classList.contains("lqty");list.querySelectorAll(".lqty").forEach(q=>q.remove());if(open)return;
        row.insertAdjacentHTML("afterend",`<div class="lqty"><span class="muted">Servings</span>${[.5,1,1.5,2,3].map(m=>`<button data-m="${m}">${m===.5?"½":m}</button>`).join("")}</div>`);
        row.nextElementSibling.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const m=+b.dataset.m;addFromLib(x,m);row.nextElementSibling.remove();sfx("check");toast(`+${Math.round(x.kcal*m)} kcal · ${x.en}`,1600);tot()}}};
    el.querySelector("#fl-manual").onclick=()=>{closeSheet(true);foodSheet()};
    draw();
  });
}

const pcfg=()=>Object.assign({f:25,s:5,l:15,r:4,auto:false,snd:"off"},meta().pomoCfg||{});
const PH={focus:["Focus","Deep work time ✨"],short:["Short break","Breathe, stretch, sip water 🌿"],long:["Long break","You earned it — step away ☕"]};
const phaseLen=(ph,c)=>(ph==="focus"?c.f:ph==="short"?c.s:c.l)*60;
function pomo(){const c=pcfg();return Object.assign({phase:"focus",running:false,endAt:null,left:phaseLen("focus",c),round:0,taskId:""},meta().pomo||{})}
function pLeft(p){return p.running&&p.endAt?Math.max(0,(p.endAt-Date.now())/1000):p.left}
const mmss=s=>{s=Math.ceil(s);return pad(Math.floor(s/60))+":"+pad(s%60)};
const focusOn=k=>all("focus").filter(f=>f.date===k);
const focusMin=k=>focusOn(k).reduce((a,f)=>a+(f.min||0),0);
function setPomo(patch,quiet){setMetaQ({pomo:Object.assign(pomo(),patch)},quiet)}

function pStart(){const p=pomo();if(p.running)return;setPomo({running:true,endAt:Date.now()+p.left*1000});sfx("chime");ambient(p.phase==="focus"?pcfg().snd:"off")}
function pPause(){const p=pomo();if(!p.running)return;setPomo({running:false,left:pLeft(p),endAt:null});ambient("off");sfx("soft")}
function pNext(completed){
  const c=pcfg(),p=pomo();let round=p.round,next;
  if(p.phase==="focus"){
    if(completed){const end=Date.now();const min=c.f;put({kind:"focus",id:uid(),start:end-min*6e4,end,min,date:today(),taskId:p.taskId||""},true);round++;
      confetti();toast(`🍅 ${min} minutes of focus — well done!`);try{if("Notification" in window&&Notification.permission==="granted")new Notification("Lines",{body:"Focus session done — time for a break 🌿"})}catch(e){}}
    next=round>0&&round%c.r===0?"long":"short";
  }else{next="focus";if(completed){sfx("chime");toast("Break's over — ready to focus? 🍅");try{if("Notification" in window&&Notification.permission==="granted")new Notification("Lines",{body:"Break's over — ready to focus? 🍅"})}catch(e){}}}
  const auto=completed&&c.auto;const len=phaseLen(next,c);
  setPomo({phase:next,round,running:auto,left:len,endAt:auto?Date.now()+len*1000:null});
  ambient(auto&&next==="focus"?c.snd:"off");
}

let pdfLoading=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();if(pdfLoading)return pdfLoading;
  const add=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfLoading=add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js"));return pdfLoading;
}
async function openReader(id){

  document.body.appendChild(R);
  const key=e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key==="Escape")close()};
  const close=()=>{R.remove();document.removeEventListener("keydown",key)};

  let doc,page=st.page||1,busy=false;

    busy=true;const p=await doc.getPage(page);const stage=R.querySelector("#r-stage");
    const w=Math.min(stage.clientWidth-16,900);const scale=w/p.getViewport({scale:1}).width;const dpr=window.devicePixelRatio||1;
    const vp=p.getViewport({scale:scale*dpr});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+"px";

    R.querySelector("#r-pg").textContent=`Page ${page} of ${doc.numPages}`;busy=false;
    const prog=Math.round(page/doc.numPages*100);clearTimeout(draw.t);draw.t=setTimeout(()=>put(Object.assign({},bookState(id),{page,progress:Math.max(prog,bookState(id).progress||0),status:bookState(id).status||"reading"})),1200);
  }

  let sx=null;const stg=R.querySelector("#r-stage");stg.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});stg.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null});
  R.querySelector("#r-snap").onclick=()=>{const c=R.querySelector("canvas");if(!c)return;
    c.toBlob(async bl=>{if(!bl)return;const r=await upload(new File([bl],"page-"+page+".png",{type:"image/png"}));if(!r)return;
      hlSheet({type:"image",assetId:r.id,bookId:id,page:String(page)},id);const o=document.getElementById("ov");o&&(o.style.zIndex=58)},"image/png")};
  try{
    await loadPdfJs();
    const data=await (String(st.fileId).startsWith("local:")?(await idbGet(st.fileId)):(await fetch(blobUrl(st.fileId)).then(x=>x.blob()))).arrayBuffer();
    doc=await pdfjsLib.getDocument({data,isEvalSupported:false}).promise;if(page>doc.numPages)page=1;draw(0);

}

/* day-streak with rest days: up to `rest` missed days per Sat–Fri week don't break it */
function graceStreak(days,rest){let n=0,d=new Date(),miss={},started=false;
  for(let i=0;i<400;i++){const k=dkey(d);const wk=dkey(weekStart(d));
    if(days.has(k)){n++;started=true}else if(i>0||started){miss[wk]=(miss[wk]||0)+1;if(miss[wk]>rest)break}

const VOCAB="cardiology respiratory medicine gastroenterology hepatology endocrinology diabetes metabolic metabolism nephrology renal neurology rheumatology haematology hematology oncology infectious infection diseases disease dermatology psychiatry clinical pharmacology therapeutics toxicology basic sciences science statistics epidemiology genetics immunology biochemistry physiology anatomy biology molecular ophthalmology geriatrics geriatric palliative emergency critical sexual health tropical nutrition introduction cardiovascular pulmonary gastrointestinal neurological musculoskeletal haematological electrolytes poisoning".split(" ");
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function fixWord(w,first){const core=w.replace(/[^A-Za-z]/g,"");const cap=v=>first||/^[A-Z]/.test(w)?v[0].toUpperCase()+v.slice(1):v;
  if(core.length<4)return w;const l=core.toLowerCase();if(VOCAB.includes(l))return cap(l);
  let best=null,bd=99;for(const v of VOCAB){if(Math.abs(v.length-l.length)>3)continue;const d=lev(l,v);if(d<bd){bd=d;best=v}}
  if(best&&bd/Math.max(l.length,best.length)<=.38)return cap(best);
  return /[a-z].*[A-Z]|[A-Z]{2,}.*[a-z]/.test(core)?cap(l):w}
function parseChapters(text){const out=[];
  text.split(/\n+/).forEach(l=>{l=l.replace(/\t/g," ").trim().replace(/[.,;:]+$/,"");if(!l)return;
    let p=null;const pm=l.match(/[.\s·…_-]{2,}\s*(\d{1,4})\s*$/)||l.match(/\s(\d{1,4})\s*$/);if(pm){p=+pm[1];l=l.slice(0,pm.index)}
    l=l.replace(/^(chapter|ch\.?|section|unit|part)\s*\d+[:.\-–\s]*/i,"").replace(/^[0-9IlO]{1,3}(\.\d+)*[.)\-–:\s]+/,"").replace(/[.·…_]{2,}.*$/,"").split(/\s+[.\-·…«»,:;'"`~_|][^\s]*/)[0].trim();
    const tk=l.split(/\s+/).filter(Boolean);if(!tk.length||tk.filter(x=>x.replace(/[^A-Za-z]/g,"").length<=2).length/tk.length>.5)return;
    l=tk.map((w,i)=>fixWord(w,i===0)).join(" ").replace(/\s+[)\]]+$|[)\]]+$/,"");
    if(l.replace(/[^A-Za-z\u0600-\u06FF]/g,"").length<3||/^(contents|index|preface|foreword|acknowledg|abbreviation|page)/i.test(l))return;
    out.push({title:l.slice(0,90),p})});
  out.forEach((c,i)=>{const nx=out.slice(i+1).find(x=>x.p!=null);c.w=c.p!=null&&nx&&nx.p>c.p?Math.min(200,nx.p-c.p):null});
  const ws=out.map(c=>c.w).filter(Boolean),avg=ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:1;out.forEach(c=>{if(!c.w)c.w=Math.round(avg)||1});
  return out}

async function zipDir(file){const L=file.size,tail=new DataView(await file.slice(Math.max(0,L-66000)).arrayBuffer());let e=-1;
  for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw "zip";
  const cnt=tail.getUint16(e+10,true),sz=tail.getUint32(e+12,true),off=tail.getUint32(e+16,true);const cd=new DataView(await file.slice(off,off+sz).arrayBuffer());const td=new TextDecoder(),o=[];let p=0;
  for(let k=0;k<cnt;k++){const meth=cd.getUint16(p+10,true),csz=cd.getUint32(p+20,true),nl=cd.getUint16(p+28,true),xl=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true),lo=cd.getUint32(p+42,true);
    o.push({name:td.decode(new Uint8Array(cd.buffer,p+46,nl)),meth,csz,lo});p+=46+nl+xl+cl}return o}

  if(en.meth===8){if(!window.DecompressionStream)throw "old";b=await new Response(b.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob()}return new Uint8Array(await b.arrayBuffer())}

  const en=ents.find(x=>x.name==="collection.anki21b")||ents.find(x=>x.name==="collection.anki21")||ents.find(x=>x.name==="collection.anki2");if(!en)throw "nocol";
  let bytes=await zipGet(file,en);if(en.name.endsWith("21b")){await loadScript("lib/fzstd.js");bytes=fzstd.decompress(bytes)}
  await loadScript("lib/sql-wasm.js");const SQL=await initSqlJs({locateFile:f=>"lib/"+f});const db=new SQL.Database(bytes);
  const q=s=>{try{const r=db.exec(s);return r.length?r[0].values:[]}catch(e){return []}};
  const days={},time={};let r30=0,p30=0;const cut=Date.now()-30*864e5;

  const decks=q("select did,count(*),sum(case when ivl>=21 then 1 else 0 end),sum(case when queue=0 then 1 else 0 end) from cards group by did").map(([did,n,mat,nw])=>({name:dn[did]||"Deck",n,mat,nw})).sort((a,b)=>b.n-a.n).slice(0,12);
  const tot=q("select count(*),sum(case when ivl>=21 then 1 else 0 end),sum(case when queue=0 then 1 else 0 end) from cards")[0]||[0,0,0];
  const total=Object.values(days).reduce((a,b)=>a+b,0);db.close();
  put({kind:"ankistat",id:"main",at:today(),days,time,total,cards:tot[0],mature:tot[1],fresh:tot[2],ret:r30?Math.round(p30/r30*100):null,decks},true);
  sfx("success");toast(`Anki imported: ${total.toLocaleString()} reviews ✓`,3000);addXP("med",10,"Anki import");render()}
 catch(e){toast(e==="nocol"?"That file isn't an Anki collection":e==="old"?"Please update iOS to read this file":"Couldn't read that Anki file",3500)}}

/* ---- OCR for chapter photos (runs on the phone) ---- */
let OCRW=null;
async function ocrFiles(files,onp){await loadScript("lib/ocr/tesseract.min.js");const base=new URL("lib/ocr/",location.href).href;
  if(!OCRW)OCRW=await Tesseract.createWorker("eng",1,{workerPath:base+"worker.min.js",corePath:base+"core/",langPath:base+"lang",logger:m=>{if(m.status==="recognizing text")onp&&onp(m.progress)}});
  try{await OCRW.setParameters({preserve_interword_spaces:"1"})}catch(e){}
  let out="";for(const f of files){const {data}=await OCRW.recognize(await ocrPrep(f));out+=data.text+"\n"}return out}
async function ocrPrep(f){try{const u=URL.createObjectURL(f);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});
  const tw=Math.max(1400,Math.min(2000,im.naturalWidth<1200?im.naturalWidth*2:im.naturalWidth)),sc=tw/im.naturalWidth;const cv=document.createElement("canvas");cv.width=tw;cv.height=Math.round(im.naturalHeight*sc);
  const x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);const d=x.getImageData(0,0,cv.width,cv.height),p=d.data;
  const h=new Uint32Array(256);for(let i=0;i<p.length;i+=4){const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0;p[i]=g;h[g]++}
  const n=p.length/4;let lo=0,hi=255,c=0;while(c<n*.02&&lo<255)c+=h[lo++];c=0;while(c<n*.02&&hi>0)c+=h[hi--];const k=255/Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=v}x.putImageData(d,0,0);return cv}catch(e){return f}}

(function(){const h=location.hash;if(!h.startsWith("#import="))return;
  try{const b=h.slice(8).replace(/-/g,"+").replace(/_/g,"/");const bin=atob(b);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const j=JSON.parse(new TextDecoder().decode(bytes));let n=0;
    if(j&&j.app==="lines-backup"&&j.items)Object.entries(j.items).forEach(([k,v])=>{if(!v||!v.kind)return;const cur=S.items[k];if(cur&&(cur.upd||0)>=(v.upd||0))return;S.items[k]=v;n++});
    try{localStorage.setItem("lines-app",JSON.stringify(S.items))}catch(e){}
    history.replaceState(null,"",location.pathname);S.tab="home";setTimeout(()=>toast(`Your data is here ✓ (${n} items added)`,3500),600);
  }catch(e){history.replaceState(null,"",location.pathname);setTimeout(()=>toast("That import link didn't work"),600)}})();
render();setSync();initCloud();
if("serviceWorker" in navigator&&location.protocol==="https:"){const hadSW=!!navigator.serviceWorker.controller;let rl=0;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadSW||rl)return;rl=1;const go=()=>{const p=meta().pomo;if(p&&p.running)setTimeout(go,4000);else location.reload()};go()});navigator.serviceWorker.register("sw.js").then(r=>{document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{})}
</script>
</body>
